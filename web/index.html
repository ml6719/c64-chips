<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>The Multitude — C64</title>
	<style>
		/* Literal copy of machines/_shared/src/toolbar.css's whole-page
		   scaffold (hamburger dropdown on narrow screens, permanent
		   right-side sidebar once there's width to spare) - this is a
		   standalone fibs/Emscripten build, not a bundler that can import
		   it, so keep these two in sync by eye. See that file (or
		   machines/atari-st/web/index.html, which copies the same block)
		   for the reasoning behind the breakpoint/sidebar choice. */
		html, body.mx-app {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: #111;
		}
		body.mx-app {
			display: flex;
			flex-direction: column;
			font-family: monospace;
			color: #edebf5;
		}
		.mx-hamburger {
			position: fixed;
			top: 8px;
			left: 8px;
			z-index: 30;
			width: 40px;
			height: 40px;
			font-size: 18px;
			background: #262842;
			color: #edebf5;
			border: 1px solid #565a82;
			border-radius: 4px;
			cursor: pointer;
		}
		.mx-toolbar {
			display: none;
			flex-direction: column;
			align-items: stretch;
			gap: 10px;
			position: fixed;
			inset: 0 0 auto 0;
			z-index: 20;
			padding: 56px 16px 16px;
			background: #1a1b2e;
			border-bottom: 2px solid #43456a;
			font-family: monospace;
			font-size: 14px;
			color: #edebf5;
			max-height: 100%;
			overflow-y: auto;
			box-sizing: border-box;
		}
		.mx-toolbar.mx-open {
			display: flex;
		}
		.mx-toolbar button,
		.mx-toolbar select,
		.mx-toolbar .mx-home {
			font-family: monospace;
			font-size: 13px;
			background: #262842;
			color: #edebf5;
			border: 1px solid #565a82;
			padding: 6px 8px;
			cursor: pointer;
		}
		.mx-toolbar .mx-home {
			display: block;
			text-align: center;
			text-decoration: none;
			box-sizing: border-box;
		}
		.mx-main {
			flex: 1;
			min-height: 0;
			display: flex;
			flex-direction: column;
		}
		#canvas-wrap {
			flex: 1;
			min-height: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
		}
		#canvas {
			display: block;
			image-rendering: pixelated;
			background: #000;
		}
		@media (min-width: 700px) {
			body.mx-app {
				flex-direction: row;
			}
			.mx-hamburger {
				display: none;
			}
			.mx-toolbar {
				display: flex !important;
				position: static;
				inset: auto;
				order: 1;
				width: 220px;
				flex-shrink: 0;
				height: 100%;
				padding: 16px;
				border-bottom: none;
				border-right: 2px solid #43456a;
			}
			.mx-main {
				order: 2;
			}
		}

		/* On-screen keyboard: beige/tan Commodore-style keys with the
		   iconic brown/rust accent row (CTRL/RUN-STOP/RESTORE/SHIFT-LOCK
		   equivalents), matching real C64 keycap colouring - distinct
		   from every other machine's theme so far. Hidden by default via
		   [hidden], same convention as the other machines' keyboard
		   toggle. */
		#keyboard {
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			gap: 3px;
			background: #8a7f6a;
			padding: 8px 8px 10px;
		}
		#keyboard[hidden] {
			display: none;
		}
		.c64-vkb-row {
			display: flex;
			gap: 3px;
		}
		.c64-vkb-key {
			flex: 1 1 0;
			background: #cbbfa0;
			border: 1px solid #6b5f4a;
			border-radius: 4px;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 2px 2px rgba(0, 0, 0, 0.35);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 4px 2px;
			font-family: monospace;
			font-size: 13px;
			color: #2a2416;
			user-select: none;
			touch-action: none;
		}
		.c64-vkb-key:active {
			box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.4);
		}
		.c64-vkb-key.c64-vkb-accent {
			background: #6b4a3a;
			color: #ede4d0;
		}
		.c64-vkb-key.c64-vkb-locked {
			box-shadow: inset 0 0 0 2px #4a9c94;
		}
		.c64-vkb-top {
			font-size: 10px;
			line-height: 1;
		}
	</style>
</head>
<body class="mx-app">
	<button id="hamburger" class="mx-hamburger">☰</button>
	<div id="toolbar" class="mx-toolbar">
		<a href="../" class="mx-home">🏠 Home</a>
		<button id="reset">Reset</button>
		<button id="pick-prg" class="mx-load">Load disk/PRG…</button>
		<input type="file" id="file-prg" accept=".prg,.d64,.zip" hidden />
		<select id="d64-programs" hidden></select>
		<span id="drive-mode-label">Drive: software</span>
		<button id="pick-1541-rom" class="mx-load">Load 1541 ROM…</button>
		<input type="file" id="file-1541-rom" accept=".bin,.rom" hidden />
		<button id="reset-1541-rom" hidden>Reset 1541 ROM</button>
		<span id="system-rom-label">ROM: open-roms</span>
		<button id="pick-system-rom" class="mx-load">Load System ROM…</button>
		<input type="file" id="file-system-rom" multiple accept=".bin,.rom" hidden />
		<button id="reset-system-rom" hidden>Reset System ROM</button>
		<button id="fullscreen">Fullscreen</button>
		<button id="keyboard-toggle">⌨ Keyboard</button>
		<label class="mx-field">
			<button id="mute-toggle" class="mx-mute" title="Mute">🔊</button>
			<input type="range" id="volume-slider" class="mx-volume" min="0" max="100" value="100" />
		</label>
	</div>
	<div class="mx-main">
		<div id="canvas-wrap">
			<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
		</div>
		<div id="keyboard" hidden></div>
	</div>
	<script>
		// The Multitude's own web bridge — mx_reset()/mx_key_down()/
		// mx_key_up()/mx_quickload_prg() are exported straight from
		// examples/emus/c64.c (see the comment there for why: the plain
		// `c64` fibs target has no webapi.c wired in at all, only the
		// heavier `-ui` variant with floooh's own debug overlay does, and
		// we don't want that UI in our shell). All four are safe to call
		// at any time — chips-test's main loop is a plain per-frame
		// callback (sokol_app's emscripten_request_animation_frame),
		// nothing like Hatari's Asyncify-coroutine danger zone, so no
		// pending-action/memory-write dance is needed here.
		var Module = {
			canvas: document.getElementById('canvas'),
			onRuntimeInitialized: function () { onReady(Module); },
		};

		// ZIP support (ported from The Multitude's zx84 vendor, same
		// dependency-free approach as every other machine here: browser
		// DecompressionStream('deflate-raw'), no bundler/library).
		async function unzip(data, exts) {
			const lowerExts = exts.map((e) => e.toLowerCase());
			const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
			const eocdSig = 0x06054b50;
			const searchStart = Math.max(0, data.length - 65557);
			let eocdOffset = -1;
			for (let i = data.length - 22; i >= searchStart; i--) {
				if (view.getUint32(i, true) === eocdSig) { eocdOffset = i; break; }
			}
			if (eocdOffset === -1) throw new Error('Not a valid ZIP file (EOCD not found)');
			const totalEntries = view.getUint16(eocdOffset + 10, true);
			const cdOffset = view.getUint32(eocdOffset + 16, true);
			const cdSig = 0x02014b50;
			const lfhSig = 0x04034b50;
			const entries = [];
			let pos = cdOffset;
			for (let i = 0; i < totalEntries; i++) {
				if (pos + 46 > data.length || view.getUint32(pos, true) !== cdSig) break;
				const method = view.getUint16(pos + 10, true);
				const compressedSize = view.getUint32(pos + 20, true);
				const uncompressedSize = view.getUint32(pos + 24, true);
				const nameLen = view.getUint16(pos + 28, true);
				const extraLen = view.getUint16(pos + 30, true);
				const commentLen = view.getUint16(pos + 32, true);
				const localHeaderOffset = view.getUint32(pos + 42, true);
				const nameBytes = data.subarray(pos + 46, pos + 46 + nameLen);
				const name = new TextDecoder('utf-8').decode(nameBytes);
				pos += 46 + nameLen + extraLen + commentLen;
				if (name.endsWith('/')) continue;
				if (method !== 0 && method !== 8) continue;
				if (!lowerExts.some((ext) => name.toLowerCase().endsWith(ext))) continue;
				entries.push({ name, method, compressedSize, uncompressedSize, localHeaderOffset });
			}
			const results = [];
			for (const entry of entries) {
				const lhPos = entry.localHeaderOffset;
				if (lhPos + 30 > data.length || view.getUint32(lhPos, true) !== lfhSig) continue;
				const localNameLen = view.getUint16(lhPos + 26, true);
				const localExtraLen = view.getUint16(lhPos + 28, true);
				const dataStart = lhPos + 30 + localNameLen + localExtraLen;
				const compressed = data.subarray(dataStart, dataStart + entry.compressedSize);
				const fileData = entry.method === 0 ? compressed : await inflate(compressed);
				results.push({ name: entry.name, data: fileData });
			}
			return results;
		}
		async function inflate(compressed) {
			const ds = new DecompressionStream('deflate-raw');
			const writer = ds.writable.getWriter();
			writer.write(compressed);
			writer.close();
			const reader = ds.readable.getReader();
			const chunks = [];
			let totalLen = 0;
			while (true) {
				const { done, value } = await reader.read();
				if (done) break;
				chunks.push(value);
				totalLen += value.byteLength;
			}
			const result = new Uint8Array(totalLen);
			let offset = 0;
			for (const chunk of chunks) { result.set(chunk, offset); offset += chunk.byteLength; }
			return result;
		}

		// D64 support: parses the disk's real directory/file-chain structure
		// directly in JS and extracts a chosen PRG's bytes - no 1541 drive
		// ROM involved at all (see machines/c64/CLAUDE.md for why: the real
		// firmware is copyrighted Commodore content we won't bundle, same
		// call as every other ROM decision in this project). This covers
		// the large majority of released C64 software - GameBase64/CSDb
		// both standardize on D64 as the archive format, and most disks
		// just need their directory read and a PRG's sectors copied out,
		// not real drive-hardware timing. Doesn't handle copy-protection
		// schemes that depend on genuine 1541 hardware quirks - those need
		// the optional real-ROM path below instead.
		//
		// Standard 35-track, no-error-info D64: 174848 bytes exactly.
		// http://vice-emu.sourceforge.net (1541 disk format) - sectors per
		// track zone, directory chain starting at track 18/sector 1, GCR
		// track/sector-chain file storage all match this widely-published,
		// unambiguous format (confirmed: the sectors-per-track table below
		// sums to exactly 174848 bytes, the well-known standard D64 size).
		const D64_SECTORS_PER_TRACK = (() => {
			const table = [];
			for (let t = 1; t <= 17; t++) table[t] = 21;
			for (let t = 18; t <= 24; t++) table[t] = 19;
			for (let t = 25; t <= 30; t++) table[t] = 18;
			for (let t = 31; t <= 35; t++) table[t] = 17;
			return table;
		})();
		function d64SectorOffset(track, sector) {
			let offset = 0;
			for (let t = 1; t < track; t++) offset += D64_SECTORS_PER_TRACK[t];
			return (offset + sector) * 256;
		}
		function d64ReadSector(bytes, track, sector) {
			const off = d64SectorOffset(track, sector);
			return bytes.subarray(off, off + 256);
		}
		function petsciiToAscii(petsciiBytes) {
			let s = '';
			for (const b of petsciiBytes) {
				if (b === 0xA0) break; // padding
				s += (b >= 0x20 && b < 0x7F) ? String.fromCharCode(b) : '?';
			}
			return s;
		}
		function parseD64Directory(bytes) {
			const programs = [];
			let track = 18, sector = 1;
			const seen = new Set();
			while (track !== 0) {
				const key = track + '/' + sector;
				if (seen.has(key)) break; // guard against a corrupt/circular chain
				seen.add(key);
				const dirSector = d64ReadSector(bytes, track, sector);
				const nextTrack = dirSector[0];
				const nextSector = dirSector[1];
				for (let i = 0; i < 8; i++) {
					const entryOff = i * 32;
					const fileType = dirSector[entryOff + 2];
					const fileTrack = dirSector[entryOff + 3];
					const fileSector = dirSector[entryOff + 4];
					const nameBytes = dirSector.subarray(entryOff + 5, entryOff + 21);
					if ((fileType & 0x0F) === 2 && fileTrack !== 0) { // PRG type only
						programs.push({ name: petsciiToAscii(nameBytes), track: fileTrack, sector: fileSector });
					}
				}
				track = nextTrack;
				sector = nextSector;
			}
			return programs;
		}
		function readD64File(bytes, track, sector) {
			const chunks = [];
			const seen = new Set();
			while (track !== 0) {
				const key = track + '/' + sector;
				if (seen.has(key)) break;
				seen.add(key);
				const s = d64ReadSector(bytes, track, sector);
				const nextTrack = s[0];
				const nextSector = s[1];
				if (nextTrack === 0) {
					// last sector: nextSector holds the count of valid data bytes
					chunks.push(s.subarray(2, 2 + nextSector));
				} else {
					chunks.push(s.subarray(2, 256));
				}
				track = nextTrack;
				sector = nextSector;
			}
			const total = chunks.reduce((n, c) => n + c.length, 0);
			const result = new Uint8Array(total);
			let pos = 0;
			for (const c of chunks) { result.set(c, pos); pos += c.length; }
			return result;
		}

		function quickloadPrg(bytes) {
			// 'array' arg type marshals via stack allocation - no need for
			// raw _malloc/_free (not exported by default; ccall is, via
			// this target's one extra EXPORTED_RUNTIME_METHODS link option
			// in fibs.ts, scoped to just the c64 target).
			return Module.ccall('mx_quickload_prg', 'boolean', ['array', 'number'], [bytes, bytes.length]);
		}

		// Optional real 1541 drive emulation - off by default (software
		// D64 parsing above covers the large majority of games with zero
		// licensing exposure; see machines/c64/CLAUDE.md). If the user
		// supplies their own legally-obtained ROM dump, we stage it into
		// the WASM module and reboot - same "Load TOS" convention already
		// used for Atari ST. sessionStorage carries the ROM across the
		// reload, so it only needs re-picking if the tab is closed.
		const C1541_ROM_SESSION_KEY_C000 = 'c64C1541RomC000Base64';
		const C1541_ROM_SESSION_KEY_E000 = 'c64C1541RomE000Base64';
		const C1541_ROM_SESSION_KEY_NAME = 'c64C1541RomName';
		const SYSTEM_ROM_SESSION_KEY_KERNAL = 'c64SystemRomKernalBase64';
		const SYSTEM_ROM_SESSION_KEY_BASIC = 'c64SystemRomBasicBase64';
		const SYSTEM_ROM_SESSION_KEY_CHAR = 'c64SystemRomCharBase64';
		function bytesToBase64(bytes) {
			let binary = '';
			for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
			return btoa(binary);
		}
		function base64ToBytes(base64) {
			const binary = atob(base64);
			const bytes = new Uint8Array(binary.length);
			for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
			return bytes;
		}
		// Must run as the very first thing in onReady(), before anything
		// else - sokol_app's first frame (which runs app_init() ->
		// c64_init(), the point where the ROM pointers actually get read)
		// fires on the next requestAnimationFrame, strictly after this
		// synchronous onRuntimeInitialized callback returns. Staging here
		// is what makes c64_desc()'s ternaries (see c64.c) pick up the
		// real ROM instead of the zeroed placeholder.
		function restageC1541RomIfPresent() {
			const c000b64 = sessionStorage.getItem(C1541_ROM_SESSION_KEY_C000);
			const e000b64 = sessionStorage.getItem(C1541_ROM_SESSION_KEY_E000);
			if (!c000b64 || !e000b64) return false;
			const c000 = base64ToBytes(c000b64);
			const e000 = base64ToBytes(e000b64);
			Module.ccall('mx_stage_c1541_rom', null, ['array', 'number', 'array', 'number'], [c000, c000.length, e000, e000.length]);
			return true;
		}
		function restageSystemRomIfPresent() {
			const kernalb64 = sessionStorage.getItem(SYSTEM_ROM_SESSION_KEY_KERNAL);
			const basicb64 = sessionStorage.getItem(SYSTEM_ROM_SESSION_KEY_BASIC);
			const charb64 = sessionStorage.getItem(SYSTEM_ROM_SESSION_KEY_CHAR);
			if (!kernalb64 || !basicb64 || !charb64) return false;
			const kernalBytes = base64ToBytes(kernalb64);
			const basicBytes = base64ToBytes(basicb64);
			const charBytes = base64ToBytes(charb64);
			Module.ccall('mx_stage_system_rom', null,
				['array', 'number', 'array', 'number', 'array', 'number'],
				[charBytes, charBytes.length, basicBytes, basicBytes.length, kernalBytes, kernalBytes.length]);
			return true;
		}

		function onReady(Module) {
			const staged = restageC1541RomIfPresent();
			const driveModeLabel = document.getElementById('drive-mode-label');
			const resetRomButton = document.getElementById('reset-1541-rom');
			if (staged) {
				const name = sessionStorage.getItem(C1541_ROM_SESSION_KEY_NAME) || 'uploaded ROM';
				driveModeLabel.textContent = 'Drive: real ROM (' + name + ')';
				resetRomButton.hidden = false;
			}
			document.getElementById('pick-1541-rom').addEventListener('click', () => document.getElementById('file-1541-rom').click());
			document.getElementById('file-1541-rom').addEventListener('change', async () => {
				const file = document.getElementById('file-1541-rom').files[0];
				if (!file) return;
				const bytes = new Uint8Array(await file.arrayBuffer());
				// Accept either one combined 16K (C000-FFFF) dump, the
				// common single-file convention, or fail clearly rather
				// than guess at a different split.
				if (bytes.length !== 0x4000) {
					alert('Expected a 16384-byte (16K) 1541 ROM dump (C000-FFFF combined). Got ' + bytes.length + ' bytes.');
					return;
				}
				sessionStorage.setItem(C1541_ROM_SESSION_KEY_C000, bytesToBase64(bytes.subarray(0, 0x2000)));
				sessionStorage.setItem(C1541_ROM_SESSION_KEY_E000, bytesToBase64(bytes.subarray(0x2000, 0x4000)));
				sessionStorage.setItem(C1541_ROM_SESSION_KEY_NAME, file.name);
				window.location.reload();
			});
			resetRomButton.addEventListener('click', () => {
				sessionStorage.removeItem(C1541_ROM_SESSION_KEY_C000);
				sessionStorage.removeItem(C1541_ROM_SESSION_KEY_E000);
				sessionStorage.removeItem(C1541_ROM_SESSION_KEY_NAME);
				window.location.reload();
			});

			const sysStaged = restageSystemRomIfPresent();
			const systemRomLabel = document.getElementById('system-rom-label');
			const resetSystemRomButton = document.getElementById('reset-system-rom');
			if (sysStaged) {
				systemRomLabel.textContent = 'ROM: open-roms + real KERNAL/BASIC/CHAR';
				resetSystemRomButton.hidden = false;
			}
			document.getElementById('pick-system-rom').addEventListener('click', () => document.getElementById('file-system-rom').click());
			document.getElementById('file-system-rom').addEventListener('change', async () => {
				const files = [...document.getElementById('file-system-rom').files];
				if (files.length === 0) return;
				// KERNAL and BASIC are both 8K, so size alone can't tell
				// them apart - match by filename keyword instead (how real
				// romset dumps are actually named: kernal.901227-03.bin,
				// basic.901226-01.bin, characters.901225-01.bin or similar).
				const find = (keyword) => files.find((f) => f.name.toLowerCase().includes(keyword));
				const kernalFile = find('kernal');
				const basicFile = find('basic');
				const charFile = find('char'); // matches "char" and "chargen"
				if (!kernalFile || !basicFile || !charFile) {
					alert('Need 3 files with "kernal", "basic", and "char" (or "chargen") somewhere in their names.');
					return;
				}
				const kernalBytes = new Uint8Array(await kernalFile.arrayBuffer());
				const basicBytes = new Uint8Array(await basicFile.arrayBuffer());
				const charBytes = new Uint8Array(await charFile.arrayBuffer());
				if (kernalBytes.length !== 0x2000 || basicBytes.length !== 0x2000 || charBytes.length !== 0x1000) {
					alert('Wrong size(s) - need KERNAL 8192 bytes, BASIC 8192 bytes, character ROM 4096 bytes.');
					return;
				}
				sessionStorage.setItem(SYSTEM_ROM_SESSION_KEY_KERNAL, bytesToBase64(kernalBytes));
				sessionStorage.setItem(SYSTEM_ROM_SESSION_KEY_BASIC, bytesToBase64(basicBytes));
				sessionStorage.setItem(SYSTEM_ROM_SESSION_KEY_CHAR, bytesToBase64(charBytes));
				window.location.reload();
			});
			resetSystemRomButton.addEventListener('click', () => {
				sessionStorage.removeItem(SYSTEM_ROM_SESSION_KEY_KERNAL);
				sessionStorage.removeItem(SYSTEM_ROM_SESSION_KEY_BASIC);
				sessionStorage.removeItem(SYSTEM_ROM_SESSION_KEY_CHAR);
				window.location.reload();
			});

			document.getElementById('reset').addEventListener('click', () => Module._mx_reset());

			const fileInput = document.getElementById('file-prg');
			const d64Select = document.getElementById('d64-programs');
			document.getElementById('pick-prg').addEventListener('click', () => fileInput.click());

			function loadD64(d64Bytes) {
				const programs = parseD64Directory(d64Bytes);
				if (programs.length === 0) { alert('No PRG files found on this disk'); return; }
				d64Select.innerHTML = '';
				for (const p of programs) {
					const opt = document.createElement('option');
					opt.textContent = p.name || '(unnamed)';
					d64Select.appendChild(opt);
				}
				d64Select.hidden = programs.length < 2;
				d64Select.onchange = () => {
					const p = programs[d64Select.selectedIndex];
					quickloadPrg(readD64File(d64Bytes, p.track, p.sector));
				};
				// Load the first program immediately - matches how most
				// single-program disks are meant to be used (put disk in,
				// it just runs); the dropdown lets you pick a different
				// one afterward if the disk has more than one.
				quickloadPrg(readD64File(d64Bytes, programs[0].track, programs[0].sector));
			}

			fileInput.addEventListener('change', async () => {
				const file = fileInput.files[0];
				if (!file) return;
				let bytes = new Uint8Array(await file.arrayBuffer());
				let name = file.name;
				if (/\.zip$/i.test(name)) {
					const entries = await unzip(bytes, ['.prg', '.d64']);
					if (entries.length === 0) { alert('ZIP has no .prg or .d64 file'); return; }
					bytes = entries[0].data;
					name = entries[0].name;
				}
				if (/\.d64$/i.test(name)) {
					loadD64(bytes);
				} else {
					d64Select.hidden = true;
					quickloadPrg(bytes);
				}
			});

			document.getElementById('fullscreen').addEventListener('click', () => {
				document.documentElement.requestFullscreen();
			});

			// Live volume control - lazily splices a GainNode between
			// sokol_audio's own Web Audio node and its destination the
			// first time it's touched (Module._saudio_context/_saudio_node
			// don't exist until audio actually starts). Exposed directly
			// on Module by sokol_audio.h's Emscripten backend - simpler
			// than Hatari's equivalent (SDL2 buries it under Module.SDL2).
			let gainNode = null;
			function getGainNode() {
				const ctx = Module._saudio_context;
				const node = Module._saudio_node;
				if (!node || !ctx) return null;
				if (!gainNode) {
					gainNode = ctx.createGain();
					node.disconnect();
					node.connect(gainNode);
					gainNode.connect(ctx.destination);
				}
				return gainNode;
			}
			const volumeSlider = document.getElementById('volume-slider');
			const muteButton = document.getElementById('mute-toggle');
			let muted = false;
			let volumeBeforeMute = volumeSlider.value;
			function applyVolume() {
				const node = getGainNode();
				if (!node) return;
				node.gain.value = muted ? 0 : volumeSlider.value / 100;
			}
			volumeSlider.addEventListener('input', () => {
				if (muted && volumeSlider.value != 0) {
					muted = false;
					muteButton.textContent = '🔊';
				}
				applyVolume();
			});
			muteButton.addEventListener('click', () => {
				muted = !muted;
				muteButton.textContent = muted ? '🔇' : '🔊';
				if (!muted && volumeSlider.value == 0) {
					volumeSlider.value = volumeBeforeMute > 0 ? volumeBeforeMute : 100;
				}
				if (muted) volumeBeforeMute = volumeSlider.value;
				applyVolume();
			});

			document.getElementById('hamburger').addEventListener('click', () => {
				document.getElementById('toolbar').classList.toggle('mx-open');
			});

			// Canvas sizing: sokol_app's Emscripten backend watches the
			// canvas's CSS size and re-fits its backing store to match
			// (emscripten_set_resize_callback in sokol_app.h) - same
			// "external CSS size wins" trap as SDL2/Hatari, just phrased
			// as a feature there. Setting a CSS size based on canvas.width/
			// height BEFORE sokol has established its real native
			// resolution (still the browser's 300x150 default at that
			// point) corrupts it permanently - confirmed: canvas.width
			// ended up as 1611 (matching a wrongly-computed CSS size,
			// not any real C64 resolution) when this called resizeCanvas()
			// eagerly on load. Fix: capture the real native resolution
			// exactly ONCE, from the first genuine width/height attribute
			// mutation, into fixed variables - then always scale from
			// those cached values, never by re-reading canvas.width/height
			// live (which sokol's own feedback loop could re-corrupt).
			const canvas = document.getElementById('canvas');
			const canvasWrap = document.getElementById('canvas-wrap');
			let nativeW = 0, nativeH = 0;
			function resizeCanvas() {
				if (!nativeW || !nativeH) return;
				const scale = Math.min(canvasWrap.clientWidth / nativeW, canvasWrap.clientHeight / nativeH);
				canvas.style.width = Math.floor(nativeW * scale) + 'px';
				canvas.style.height = Math.floor(nativeH * scale) + 'px';
			}
			window.addEventListener('resize', resizeCanvas);
			// Same mobile-chrome-resize gap as Atari ST: a plain window
			// 'resize' listener misses address-bar collapse/orientation
			// changes that resize #canvas-wrap without always firing it.
			new ResizeObserver(resizeCanvas).observe(canvasWrap);
			new MutationObserver(() => {
				if (nativeW || canvas.width <= 1 || canvas.height <= 1) return;
				nativeW = canvas.width;
				nativeH = canvas.height;
				resizeCanvas();
			}).observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });

			// Focus-pause: chips-test doesn't have Hatari's pause()/
			// resume() API exposed to us, so approximate it by starving
			// the emscripten_request_animation_frame loop — the browser
			// already does this automatically for a backgrounded tab, so
			// this is really just making sure our own canvas isn't
			// fighting that. Nothing to wire here beyond what the browser
			// already does by default; noted as a gap in CLAUDE.md rather
			// than faked with a non-existent API.

			buildKeyboard();
			document.getElementById('keyboard-toggle').addEventListener('click', () => {
				const kb = document.getElementById('keyboard');
				kb.hidden = !kb.hidden;
				resizeCanvas();
			});
		}

		// Key codes straight from chips' systems/c64.h (C64_KEY_* defines
		// and the _c64_init_key_map() ASCII table) - see machines/c64/
		// CLAUDE.md for how these were verified against source rather than
		// guessed. c64_key_down()/up() take a resolved character code, not
		// a raw matrix cell - the core has no public API to hold a bare
		// SHIFT matrix press (SHIFT is registered only as a modifier, with
		// no key-code of its own), so our on-screen SHIFT is a UI-level
		// lock that changes which code subsequent taps send, not a real
		// held matrix key. CTRL/C=/RESTORE/RUN-STOP/cursor keys etc. DO
		// have real key-codes and genuinely hold via mousedown/mouseup.
		function key(label, code, shiftCode, units) {
			return { label, code, shiftCode: shiftCode ?? code, units };
		}
		function accent(label, code, units) {
			return { label, code, shiftCode: code, units, accent: true };
		}

		// Shift codes below are the *other* character the real hardware
		// actually produces (verified against the same _c64_init_key_map()
		// keymap table, both halves - not guessed): e.g. SHIFT+7 on a real
		// C64 types "'", not "&" like a PC keyboard. Keys whose shift slot
		// produces nothing distinct (same char, or a bare space no one
		// actually uses) skip the second label rather than show a
		// meaningless one.
		const KEYBOARD_ROWS = [
			[
				accent('←', 0x04),
				key('!\n1', '1'.charCodeAt(0), '!'.charCodeAt(0)),
				key('"\n2', '2'.charCodeAt(0), '"'.charCodeAt(0)),
				key('#\n3', '3'.charCodeAt(0), '#'.charCodeAt(0)),
				key('$\n4', '4'.charCodeAt(0), '$'.charCodeAt(0)),
				key('%\n5', '5'.charCodeAt(0), '%'.charCodeAt(0)),
				key('&\n6', '6'.charCodeAt(0), '&'.charCodeAt(0)),
				key('\'\n7', '7'.charCodeAt(0), '\''.charCodeAt(0)),
				key('(\n8', '8'.charCodeAt(0), '('.charCodeAt(0)),
				key(')\n9', '9'.charCodeAt(0), ')'.charCodeAt(0)),
				key('0', '0'.charCodeAt(0)),
				key('+', '+'.charCodeAt(0)), key('-', '-'.charCodeAt(0)),
				key('$\n£', '~'.charCodeAt(0), '$'.charCodeAt(0)),
				accent('HOME\nCLR', 0x0C, 1.3), accent('DEL\nINST', 0x01, 1.3),
			],
			[
				accent('CTRL', 0x0E, 1.4),
				key('Q', 'Q'.charCodeAt(0)), key('W', 'W'.charCodeAt(0)), key('E', 'E'.charCodeAt(0)),
				key('R', 'R'.charCodeAt(0)), key('T', 'T'.charCodeAt(0)), key('Y', 'Y'.charCodeAt(0)),
				key('U', 'U'.charCodeAt(0)), key('I', 'I'.charCodeAt(0)), key('O', 'O'.charCodeAt(0)),
				key('P', 'P'.charCodeAt(0)), key('@', '@'.charCodeAt(0)), key('*', '*'.charCodeAt(0)),
				accent('RESTORE', 0xFF, 1.3),
			],
			[
				accent('RUN\nSTOP', 0x03, 0x07, 1.4),
				{ label: 'SHIFT\nLOCK', code: null, shiftCode: null, units: 1.4, lockable: true, accent: true },
				key('A', 'A'.charCodeAt(0)), key('S', 'S'.charCodeAt(0)), key('D', 'D'.charCodeAt(0)),
				key('F', 'F'.charCodeAt(0)), key('G', 'G'.charCodeAt(0)), key('H', 'H'.charCodeAt(0)),
				key('J', 'J'.charCodeAt(0)), key('K', 'K'.charCodeAt(0)), key('L', 'L'.charCodeAt(0)),
				key('[\n:', ':'.charCodeAt(0), '['.charCodeAt(0)),
				key(']\n;', ';'.charCodeAt(0), ']'.charCodeAt(0)),
				key('=', '='.charCodeAt(0)),
				accent('RETURN', 0x0D, 1.6),
			],
			[
				{ label: 'SHIFT', code: null, shiftCode: null, units: 1.5, lockable: true, accent: true },
				key('Z', 'Z'.charCodeAt(0)), key('X', 'X'.charCodeAt(0)), key('C', 'C'.charCodeAt(0)),
				key('V', 'V'.charCodeAt(0)), key('B', 'B'.charCodeAt(0)), key('N', 'N'.charCodeAt(0)),
				key('M', 'M'.charCodeAt(0)),
				key('<\n,', ','.charCodeAt(0), '<'.charCodeAt(0)),
				key('>\n.', '.'.charCodeAt(0), '>'.charCodeAt(0)),
				key('?\n/', '/'.charCodeAt(0), '?'.charCodeAt(0)),
				{ label: 'SHIFT', code: null, shiftCode: null, units: 1.5, lockable: true, accent: true },
				accent('▲\nCRSR ▼', 0x0A, 0x0B, 1.3),
				accent('◀\nCRSR ▶', 0x09, 0x08, 1.3),
			],
			[
				accent('C=', 0x0F, 1),
				key('SPACE', 0x20, 0x20, 6),
				accent('F1\nF2', 0xF1, 0xF2, 1.2),
				accent('F3\nF4', 0xF3, 0xF4, 1.2),
				accent('F5\nF6', 0xF5, 0xF6, 1.2),
				accent('F7\nF8', 0xF7, 0xF8, 1.2),
			],
		];

		function buildKeyElement(k, getShiftLocked, setShiftLocked, lockSyncFns) {
			const btn = document.createElement('div');
			btn.className = 'c64-vkb-key' + (k.accent ? ' c64-vkb-accent' : '');
			btn.style.flexGrow = String(k.units ?? 1);
			if (k.label.includes('\n')) {
				const [top, main] = k.label.split('\n');
				const topEl = document.createElement('span');
				topEl.className = 'c64-vkb-top';
				topEl.textContent = top;
				const mainEl = document.createElement('span');
				mainEl.textContent = main;
				btn.append(topEl, mainEl);
			} else {
				btn.textContent = k.label;
			}

			if (k.lockable) {
				// Three keys share this lock state (SHIFT x2 + SHIFT
				// LOCK, matching real hardware's layout - SHIFT LOCK is
				// just a mechanical latch on the same matrix cell as the
				// left SHIFT). Double-click locks (stays visually down on
				// ALL three and flips getShiftLocked() for subsequent
				// taps), single click afterward releases - same
				// double-click-to-lock convention as every other
				// machine's shift key, even though there's no real matrix
				// cell being held underneath (see the comment above
				// KEYBOARD_ROWS for why).
				const sync = () => btn.classList.toggle('c64-vkb-locked', getShiftLocked());
				lockSyncFns.push(sync);
				btn.addEventListener('click', () => { if (getShiftLocked()) setShiftLocked(false); });
				btn.addEventListener('dblclick', () => setShiftLocked(true));
				return btn;
			}

			let heldCode = null;
			const press = (e) => {
				e.preventDefault();
				heldCode = getShiftLocked() ? k.shiftCode : k.code;
				if (heldCode != null) Module._mx_key_down(heldCode);
			};
			const release = (e) => {
				e.preventDefault();
				if (heldCode != null) Module._mx_key_up(heldCode);
				heldCode = null;
			};
			btn.addEventListener('pointerdown', press);
			btn.addEventListener('pointerup', release);
			btn.addEventListener('pointerleave', release);
			btn.addEventListener('pointercancel', release);
			return btn;
		}

		function buildKeyboard() {
			let shiftLocked = false;
			const lockSyncFns = [];
			const getShiftLocked = () => shiftLocked;
			const setShiftLocked = (v) => { shiftLocked = v; for (const sync of lockSyncFns) sync(); };
			const keyboardEl = document.getElementById('keyboard');
			for (const row of KEYBOARD_ROWS) {
				const rowEl = document.createElement('div');
				rowEl.className = 'c64-vkb-row';
				for (const k of row) rowEl.appendChild(buildKeyElement(k, getShiftLocked, setShiftLocked, lockSyncFns));
				keyboardEl.appendChild(rowEl);
			}
		}
	</script>
	<script src="c64.js"></script>
</body>
</html>
